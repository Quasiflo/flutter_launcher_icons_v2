name: example
description: A new Flutter project to quickly test flutter_launcher_icons.

version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.3
  flutter_launcher_icons:
    path: ../..

flutter_launcher_icons:
  #  image_path: "assets/images/icon-128x128.png"
  android:
    generate: true # can specify icon_name here e.g. "ic_launcher"
    image_path: "assets/images/icon-710x599-android.png"
    adaptive_icon_background: "assets/images/christmas-background.png" # only available for Android 8.0 devices and above
    adaptive_icon_foreground: "assets/images/icon-foreground-432x432.png" # only available for Android 8.0 devices and above
    adaptive_icon_foreground_inset: 16 # only available for Android 8.0 devices and above
    adaptive_icon_monochrome: "assets/images/icon-monochrome-432x432.png" # only available for Android 13 devices and above
    min_sdk: 21 # android min sdk min:16, default 21
  ios:
    generate: true # can specify icon_name here e.g. "My-Launcher-Icon"
    image_path: "assets/images/icon-1024x1024.png"
    remove_alpha: true
    background_color: "#ffffff"
    # Liquid Glass .icon configuration for iOS
    image_path_liquid_glass_icon: "assets/images/icon-1024x1024.png"
    liquid_glass_icon_scale: 0.85
    liquid_glass_translucency: 0.5
    liquid_glass_specular: true
    liquid_glass_shadow_kind: "Chromatic"
    liquid_glass_shadow_opacity: 0.5
    liquid_glass_blur: 0.5
    liquid_glass_offset_x: 0.0
    liquid_glass_offset_y: 0.0
  web:
    generate: true
    image_path: "assets/images/icon-1024x1024.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/images/icon-1024x1024.png"
  macos:
    generate: true
    image_path: "assets/images/icon-1024x1024.png"
  linux:
    generate: true
    image_path: "assets/images/icon-1024x1024.png"

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/icon-1024x1024.png
