# Runs formatting, the full test suite, and the analyzer for any PR opened to merge into the main branch.
name: run checks for new pr

on:
  pull_request:
    branches: [ main ]

  # allows for this workflow to be run manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      - name: get dependencies
        run: dart pub get
      - name: check formatting
        run: dart format --output=none --set-exit-if-changed lib test bin
      - name: run analyzer
        run: dart analyze --fatal-infos
      - name: run tests
        run: dart test
