# Runs the full test suite and the analyzer for any PR opened to merge into the main branch.
#
# This helps ensure we avoid breaking existing functionality and stick to the rules
# defined in the analysis_options.yaml file
name: run tests & analyzer for new pr

on:
  pull_request:
    branches: [ main ]

  # allows for this workflow to be run manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6a218f2413a3e78e9087f638a238f6b40893203d # v1.3
      - name: get dependencies
        run: dart pub get
      - name: run tests
        run: dart test
      - name: run analyzer
        run: dart analyze --fatal-infos
