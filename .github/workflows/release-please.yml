---
on:
  push:
    branches:
      - master
name: release-please
permissions: {} # no default token permissions; each job grants only what it needs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-slim
    permissions:
      contents: write # create release commits, tags, and GitHub releases
      issues: write # comment on/label issues referenced in release PRs
      pull-requests: write # create and update the release PR
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .config/rp-config.json
          manifest-file: .config/rp-manifest.json
